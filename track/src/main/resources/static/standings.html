<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LeagueTrack - Standings</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>


<div class="sidebar">

    <div class="logo">

        <div class="logo-box">
            L
        </div>

        <div>

            <h2>LeagueTrack</h2>

            <p>
                Sports Management
            </p>

        </div>

    </div>


    <nav>

        <a href="index.html">
            Dashboard
        </a>

        <a href="teams.html">
            Teams
        </a>

        <a href="fixtures.html">
            Fixtures
        </a>

        <a href="standings.html"
           class="active">

            Standings

        </a>

    </nav>

</div>



<div class="main">


    <header class="topbar">

        <div>

            <p class="small-title">
                LEAGUE TABLE
            </p>

            <h1>
                Standings
            </h1>

        </div>


        <button
                class="button light"
                onclick="loadStandings()">

            Refresh

        </button>

    </header>



    <!-- POINT SYSTEM -->

    <section class="rules">

        <div>

            <strong>3</strong>

            <span>
                Win Points
            </span>

        </div>


        <div>

            <strong>1</strong>

            <span>
                Draw Points
            </span>

        </div>


        <div>

            <strong>0</strong>

            <span>
                Loss Points
            </span>

        </div>

    </section>



    <!-- STANDINGS TABLE -->

    <section class="card">

        <div class="card-header">

            <div>

                <p class="small-title">
                    CURRENT TABLE
                </p>

                <h3>
                    Team Standings
                </h3>

            </div>

        </div>


        <div class="table-container">

            <table>

                <thead>

                <tr>

                    <th>Position</th>
                    <th>Team ID</th>
                    <th>Played</th>
                    <th>Won</th>
                    <th>Drawn</th>
                    <th>Lost</th>
                    <th>Points</th>

                </tr>

                </thead>


                <tbody id="standingTable">

                </tbody>

            </table>

        </div>

    </section>



    <!-- RESULT ENTRY -->

    <section class="card result-card">

        <p class="small-title">
            RESULT ENTRY
        </p>

        <h3>
            Update Team Result
        </h3>

        <p class="description">
            Enter the team result to update the standings.
        </p>


        <div class="result-form">

            <input
                    type="number"
                    id="resultTeamId"
                    placeholder="Team ID">


            <select id="resultType">

                <option value="WIN">
                    WIN
                </option>

                <option value="DRAW">
                    DRAW
                </option>

                <option value="LOSS">
                    LOSS
                </option>

            </select>


            <button
                    class="button dark"
                    onclick="updateResult()">

                Save Result

            </button>

        </div>


        <p id="resultMessage"
           class="message">
        </p>

    </section>


</div>


<script src="js/app.js"></script>

<script>

    loadStandings();

</script>


</body>
</html>
