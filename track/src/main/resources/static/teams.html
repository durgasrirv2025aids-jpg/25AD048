<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LeagueTrack - Teams</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>


<div class="sidebar">

    <div class="logo">

        <div class="logo-box">L</div>

        <div>
            <h2>LeagueTrack</h2>
            <p>Sports Management</p>
        </div>

    </div>


    <nav>

        <a href="index.html">Dashboard</a>

        <a href="teams.html"
           class="active">
            Teams
        </a>

        <a href="fixtures.html">
            Fixtures
        </a>

        <a href="standings.html">
            Standings
        </a>

    </nav>

</div>



<div class="main">

    <header class="topbar">

        <div>

            <p class="small-title">
                TEAM MANAGEMENT
            </p>

            <h1>Teams</h1>

        </div>

        <a href="fixtures.html"
           class="button dark">

            Go to Fixtures →

        </a>

    </header>



    <section class="page-grid">


        <!-- REGISTER TEAM -->

        <div class="card">

            <p class="small-title">
                REGISTER
            </p>

            <h3>
                Add New Team
            </h3>

            <p class="description">
                Enter the team details below.
            </p>


            <form id="teamForm">

                <label>
                    Team Name

                    <input
                            type="text"
                            id="teamName"
                            placeholder="Enter team name"
                            required>

                </label>


                <label>
                    Department

                    <input
                            type="text"
                            id="department"
                            placeholder="Enter department"
                            required>

                </label>


                <button
                        type="submit"
                        class="button dark">

                    Register Team

                </button>


                <p id="teamMessage"
                   class="message">
                </p>

            </form>

        </div>



        <!-- TEAM LIST -->

        <div class="card">

            <div class="card-header">

                <div>

                    <p class="small-title">
                        REGISTERED TEAMS
                    </p>

                    <h3>
                        Team List
                    </h3>

                </div>


                <button
                        class="button light"
                        onclick="loadTeams()">

                    Refresh

                </button>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                    <tr>

                        <th>ID</th>
                        <th>Team Name</th>
                        <th>Department</th>
                        <th>Action</th>

                    </tr>

                    </thead>


                    <tbody id="teamTable">

                    </tbody>

                </table>

            </div>

        </div>

    </section>

</div>


<script src="js/app.js"></script>

<script>

    loadTeams();

    document
        .getElementById("teamForm")
        .addEventListener("submit", addTeam);

</script>


</body>
</html>
